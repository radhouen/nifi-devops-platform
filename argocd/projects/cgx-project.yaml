apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cgx-nifi
  namespace: argocd
spec:
  description: CGX NiFi DB sync platform — China & France
  sourceRepos:
    - https://github.com/radhouen/nifi-devops-platform.git
  destinations:
    - namespace: nifi-france
      server: https://kubernetes.default.svc
    - namespace: nifi-china
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "apps"
      kind: StatefulSet
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: "networking.k8s.io"
      kind: Ingress
    - group: ""
      kind: PersistentVolumeClaim
