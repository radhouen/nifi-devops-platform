apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nifi.fullname" . }}
  labels:
    {{- include "nifi.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "nifi.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nifi.name" . }}
      app.kubernetes.io/region: {{ .Values.region.name }}
  template:
    metadata:
      labels:
        {{- include "nifi.labels" . | nindent 8 }}
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: nifi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: http
            {{- if .Values.prometheus.enabled }}
            - containerPort: {{ .Values.prometheus.port }}
              name: metrics
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "nifi.fullname" . }}-config
          env:
            - name: DB_HOST
              value: {{ .Values.region.dbHost | quote }}
            - name: DB_PORT
              value: {{ .Values.region.dbPort | quote }}
            - name: DB_NAME
              value: {{ .Values.region.dbName | quote }}
            {{- if .Values.keyVault.enabled }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "nifi.fullname" . }}-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "nifi.fullname" . }}-db-secret
                  key: password
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: nifi-data
              mountPath: /opt/nifi/nifi-current/data
            - name: nifi-flow
              mountPath: /opt/nifi/nifi-current/conf/flow.json.gz
              subPath: flow.json.gz
      volumes:
        - name: nifi-flow
          configMap:
            name: {{ include "nifi.fullname" . }}-flow
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: nifi-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
