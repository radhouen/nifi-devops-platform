apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nifi.fullname" . }}
  labels:
    {{- include "nifi.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "nifi.fullname" . }}-headless
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nifi.name" . }}
      app.kubernetes.io/region: {{ .Values.region.name }}
  template:
    metadata:
      labels:
        {{- include "nifi.labels" . | nindent 8 }}
    spec:
      {{- if .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init-conf
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - bash
            - -c
            - |
              echo "Checking conf directory..."
              if [ ! -f /opt/nifi/nifi-current/conf/nifi.properties ]; then
                echo "Copying default config files to PVC..."
                cp -rn /opt/nifi/nifi-current/conf.dist/. /opt/nifi/nifi-current/conf/ 2>/dev/null || \
                cp -rn /opt/nifi/nifi-current/conf.default/. /opt/nifi/nifi-current/conf/ 2>/dev/null || \
                cp -rn /opt/nifi/nifi-1.*/conf/. /opt/nifi/nifi-current/conf/ 2>/dev/null || \
                find /opt/nifi -name "nifi.properties" -not -path "*/conf/*" -exec cp {} /opt/nifi/nifi-current/conf/ \; 2>/dev/null
                echo "Done copying config."
              else
                echo "Config already exists, skipping."
              fi
              ls /opt/nifi/nifi-current/conf/ || echo "conf dir still empty"
          volumeMounts:
            - name: conf-data
              mountPath: /opt/nifi/nifi-current/conf
      containers:
        - name: nifi
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              name: https
          env:
            - name: NIFI_WEB_HTTPS_PORT
              value: {{ .Values.service.port | quote }}
            - name: NIFI_WEB_HTTPS_HOST
              value: "0.0.0.0"
            - name: SINGLE_USER_CREDENTIALS_USERNAME
              value: {{ .Values.singleUserCredentials.username | quote }}
            - name: SINGLE_USER_CREDENTIALS_PASSWORD
              value: {{ .Values.singleUserCredentials.password | quote }}
            {{- if .Values.registry.enabled }}
            - name: NIFI_REGISTRY_URL
              value: {{ .Values.registry.url | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: flow-data
              mountPath: /opt/nifi/nifi-current/data
            - name: conf-data
              mountPath: /opt/nifi/nifi-current/conf
            - name: content-data
              mountPath: /opt/nifi/nifi-current/content_repository
            - name: database-data
              mountPath: /opt/nifi/nifi-current/database_repository
          readinessProbe:
            httpGet:
              path: /nifi
              port: {{ .Values.service.port }}
              scheme: HTTPS
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /nifi
              port: {{ .Values.service.port }}
              scheme: HTTPS
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: flow-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.flowSize }}
    - metadata:
        name: conf-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.confSize }}
    - metadata:
        name: content-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.contentSize }}
    - metadata:
        name: database-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.persistence.databaseSize }}
