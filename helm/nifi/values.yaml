replicaCount: 1

image:
  repository: apache/nifi
  tag: "2.4.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8443
  httpsEnabled: true

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 4Gi

persistence:
  enabled: true
  storageClass: "local-path"
  flowSize: 1Gi
  confSize: 1Gi
  contentSize: 5Gi
  databaseSize: 1Gi

nodeSelector: {}
tolerations: []

registry:
  enabled: true
  url: "http://nifi-registry:18080"

keyVault:
  enabled: false

region:
  name: "france"
  dbHost: ""
  dbPort: "5432"
  dbName: ""

ingress:
  enabled: false

prometheus:
  enabled: true
  port: 9092

singleUserCredentials:
  username: admin
  password: adminadminadmin
