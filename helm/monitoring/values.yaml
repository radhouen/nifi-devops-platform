prometheus:
  server:
    persistentVolume:
      enabled: true
      storageClass: "local-path"
      size: 5Gi
  alertmanager:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  extraScrapeConfigs: |
    - job_name: 'nifi'
      static_configs:
        - targets: ['nifi-france.nifi-france.svc.cluster.local:9092']
      metrics_path: /metrics

grafana:
  adminPassword: "cgxadmin123"
  persistence:
    enabled: true
    storageClassName: "local-path"
    size: 2Gi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://monitoring-prometheus-server:80
          isDefault: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          folder: NiFi
          type: file
          options:
            path: /var/lib/grafana/dashboards/default
