grafana:
  adminPassword: "cgxadmin123"
  persistence:
    enabled: true
    storageClassName: "local-path"
    size: 2Gi
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-server:80
          isDefault: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: default
          folder: NiFi
          type: file
          options:
            path: /var/lib/grafana/dashboards/default
environment: base
region: base
