apiVersion: apps/v1
kind: Deployment
metadata:
  name: nifi-registry
  labels:
    app: nifi-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nifi-registry
  template:
    metadata:
      labels:
        app: nifi-registry
    spec:
      containers:
        - name: nifi-registry
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 18080
              name: http
          command:
            - /bin/sh
            - -c
            - |
              /opt/nifi-registry/nifi-registry-current/bin/nifi-registry.sh run
          livenessProbe:
            httpGet:
              path: /nifi-registry/
              port: 18080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /nifi-registry/
              port: 18080
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: registry-data
              mountPath: /opt/nifi-registry/nifi-registry-current/database
            - name: registry-data
              mountPath: /opt/nifi-registry/nifi-registry-current/flow_storage
              subPath: flow_storage
      volumes:
        - name: registry-data
          persistentVolumeClaim:
            claimName: nifi-registry-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nifi-registry-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: nifi-registry
  labels:
    app: nifi-registry
spec:
  type: NodePort
  ports:
    - port: 18080
      targetPort: 18080
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: nifi-registry
